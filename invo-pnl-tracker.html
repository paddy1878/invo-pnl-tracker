<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>PnL tracker</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📈</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* ================================================================
   CONFIG — the only thing to edit.
   Paste the Hyperliquid wallet address from Invo between the quotes.
   You can also override it with ?address=0x... in the URL,
   or preview the layout with fake data using ?demo=1
   ================================================================ */
</style>
<script>
  const WALLET = "0x1B52d87145bB1cc865cc230Fcb6C073C010a5c7f";
  const LIVE_REFRESH_MS = 30_000; // positions + account value
  const FULL_REFRESH_MS = 300_000; // fills + funding history
</script>
<style>
:root {
  --bg: #EDF0F3; --surface: #FFFFFF; --ink: #18212C; --muted: #5E6B7C;
  --line: #D6DCE3; --up: #157F55; --down: #C23B32; --accent: #2F4BD8;
  --empty: #F5F7F9;
  box-sizing: border-box;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #10151B; --surface: #171E26; --ink: #E6EBF0; --muted: #8B97A6;
    --line: #26303B; --up: #3DBE84; --down: #EE6B5F; --accent: #8EA2FF; --empty: #131921;
  }
}
:root[data-theme="dark"] {
  --bg: #10151B; --surface: #171E26; --ink: #E6EBF0; --muted: #8B97A6;
  --line: #26303B; --up: #3DBE84; --down: #EE6B5F; --accent: #8EA2FF; --empty: #131921;
}
*, *::before, *::after { box-sizing: inherit; }
html { scroll-padding-top: env(safe-area-inset-top, 0px); }
body {
  margin: 0; background: var(--bg); color: var(--ink);
  font: 15px/1.5 "Geist", ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  font-variant-numeric: tabular-nums;
}
.wrap { max-width: 1080px; margin: 0 auto; padding: 20px 16px 48px; }
.up { color: var(--up); } .down { color: var(--down); } .muted { color: var(--muted); }
button { font: inherit; color: inherit; cursor: pointer; }
button:focus-visible, .day:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

/* Top bar */
.top { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 16px; margin-bottom: 20px; }
.top h1 { font-size: 17px; font-weight: 600; margin: 0; letter-spacing: -0.01em; }
.wallet { font-size: 13px; color: var(--muted); }
.top .spacer { flex: 1; }
.sync { font-size: 13px; color: var(--muted); display: flex; align-items: center; gap: 6px; }
.dot { width: 7px; height: 7px; border-radius: 50%; background: var(--up); }
.dot.busy { background: var(--accent); animation: pulse 1s infinite; }
.dot.err { background: var(--down); }
@keyframes pulse { 50% { opacity: .3; } }
@media (prefers-reduced-motion: reduce) { .dot.busy { animation: none; } }
.btn { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 5px 12px; font-size: 13px; }
.btn:hover { border-color: var(--muted); }

/* Hero: the calendar */
.hero { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 20px; }
.hero-head { display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 24px; margin-bottom: 16px; }
.month-title { font-size: 28px; font-weight: 700; letter-spacing: -0.03em; margin: 0; }
.month-net { font-size: 28px; font-weight: 700; letter-spacing: -0.03em; }
.month-nav { margin-left: auto; display: flex; gap: 6px; }
.month-nav .btn { width: 34px; padding: 5px 0; }
.dow, .grid { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 6px; }
.dow div { font-size: 12px; color: var(--muted); padding: 0 6px 4px; }
.day {
  min-height: 78px; border-radius: 8px; padding: 6px 8px; background: var(--empty);
  display: flex; flex-direction: column; justify-content: space-between; border: 1px solid transparent;
  text-align: left; position: relative;
}
.day.blank { background: transparent; }
.day .n { font-size: 12px; color: var(--muted); }
.day .v { font-size: 15px; font-weight: 600; line-height: 1.2; }
.day .t { font-size: 11px; color: var(--muted); }
.day.has { color: var(--ink); }
.day.today { border-color: var(--ink); }
.day.sel { outline: 2px solid var(--accent); outline-offset: 1px; }
.day.future { opacity: .45; }

/* Stats */
.stats { display: grid; grid-template-columns: repeat(4, minmax(0,1fr)); gap: 1px; background: var(--line);
  border: 1px solid var(--line); border-radius: 14px; overflow: hidden; margin: 16px 0; }
.stat { background: var(--surface); padding: 14px 16px; }
.stat .k { font-size: 13px; color: var(--muted); }
.stat .val { font-size: 22px; font-weight: 650; letter-spacing: -0.02em; }

.cols { display: grid; grid-template-columns: 3fr 2fr; gap: 16px; }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 16px; margin-bottom: 16px; min-width: 0; }
.panel h2 { font-size: 15px; font-weight: 600; margin: 0 0 12px; display: flex; align-items: baseline; gap: 10px; }
.panel h2 .muted { font-weight: 400; font-size: 13px; }

/* Chart */
.chart { width: 100%; height: 200px; display: block; }
.chart-tip { font-size: 13px; color: var(--muted); min-height: 20px; }

/* Tables */
.scroll { overflow-x: auto; }
table { width: 100%; border-collapse: collapse; font-size: 13px; }
th { text-align: left; font-weight: 500; color: var(--muted); padding: 6px 8px; border-bottom: 1px solid var(--line); white-space: nowrap; }
td { padding: 7px 8px; border-bottom: 1px solid var(--line); white-space: nowrap; }
tr:last-child td { border-bottom: 0; }
td.r, th.r { text-align: right; }
.empty-row { color: var(--muted); padding: 16px 8px; }

.kv { display: grid; grid-template-columns: 1fr auto; gap: 8px 12px; font-size: 14px; }
.kv .k { color: var(--muted); }
.kv .v { text-align: right; font-weight: 500; }

.banner { border: 1px solid var(--down); color: var(--ink); background: var(--surface); border-radius: 10px; padding: 12px 14px; margin-bottom: 16px; font-size: 14px; }
.banner.info { border-color: var(--accent); }
.banner code { background: var(--empty); padding: 1px 5px; border-radius: 4px; }
[hidden] { display: none !important; }

@media (max-width: 760px) {
  .cols { grid-template-columns: 1fr; }
  .stats { grid-template-columns: repeat(2, minmax(0,1fr)); }
  .day { min-height: 56px; padding: 4px 5px; }
  .day .v { font-size: 12px; }
  .day .t { display: none; }
  .dow, .grid { gap: 3px; }
  .hero { padding: 14px; }
  .month-title, .month-net { font-size: 22px; }
}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <h1>PnL tracker</h1>
    <span class="wallet" id="wallet"></span>
    <span class="spacer"></span>
    <span class="sync"><span class="dot" id="dot"></span><span id="syncText">Not synced</span></span>
    <button class="btn" id="refresh" type="button">Refresh</button>
  </header>

  <div id="banner" class="banner" hidden></div>

  <section class="hero" aria-label="Daily PnL calendar">
    <div class="hero-head">
      <h2 class="month-title" id="monthTitle"></h2>
      <span class="month-net" id="monthNet"></span>
      <div class="month-nav">
        <button class="btn" id="prev" type="button" aria-label="Previous month">‹</button>
        <button class="btn" id="next" type="button" aria-label="Next month">›</button>
      </div>
    </div>
    <div class="dow"><div>Mon</div><div>Tue</div><div>Wed</div><div>Thu</div><div>Fri</div><div>Sat</div><div>Sun</div></div>
    <div class="grid" id="grid"></div>
  </section>

  <section class="stats" aria-label="Summary">
    <div class="stat"><div class="k">Today</div><div class="val" id="sToday">–</div></div>
    <div class="stat"><div class="k">Last 7 days</div><div class="val" id="sWeek">–</div></div>
    <div class="stat"><div class="k">Last 30 days</div><div class="val" id="sMonth">–</div></div>
    <div class="stat"><div class="k">All time</div><div class="val" id="sAll">–</div></div>
  </section>

  <div class="cols">
    <div>
      <section class="panel">
        <h2>Cumulative PnL <span class="muted">net of fees and funding</span></h2>
        <svg class="chart" id="chart" viewBox="0 0 600 200" preserveAspectRatio="none" role="img" aria-label="Cumulative PnL chart"></svg>
        <div class="chart-tip" id="chartTip"></div>
      </section>
      <section class="panel">
        <h2>Open positions <span class="muted" id="uPnl"></span></h2>
        <div class="scroll"><table>
          <thead><tr><th>Coin</th><th>Side</th><th class="r">Size</th><th class="r">Entry</th><th class="r">Lev</th><th class="r">Liq.</th><th class="r">Unrealised</th></tr></thead>
          <tbody id="positions"></tbody>
        </table></div>
      </section>
    </div>
    <section class="panel">
      <h2>Breakdown <span class="muted" id="rangeLabel">all synced history</span></h2>
      <div class="kv" id="breakdown"></div>
    </section>
  </div>

  <section class="panel">
    <h2>Closed trades <span class="muted" id="tradesLabel">most recent</span>
      <button class="btn" id="clearDay" type="button" hidden style="margin-left:auto">Show all</button></h2>
    <div class="scroll"><table>
      <thead><tr><th>Time</th><th>Coin</th><th>Action</th><th class="r">Size</th><th class="r">Price</th><th class="r">Fee</th><th class="r">PnL</th></tr></thead>
      <tbody id="trades"></tbody>
    </table></div>
  </section>
</div>

<script>
(() => {
  const API = "https://api.hyperliquid.xyz/info";
  const params = new URLSearchParams(location.search);
  const DEMO = params.has("demo");
  const ADDRESS = (params.get("address") || WALLET || "").trim();

  const $ = id => document.getElementById(id);
  const state = {
    fills: [], funding: [], positions: [], accountValue: null, unrealised: 0,
    portfolioAllTime: null, days: new Map(),
    viewMonth: startOfMonth(new Date()), selectedDay: null, lastSync: null,
  };

  // ---------- formatting ----------
  function money(v, compact = false) {
    if (v == null || isNaN(v)) return "–";
    const sign = v > 0.004 ? "+" : v < -0.004 ? "−" : "";
    const a = Math.abs(v);
    let s;
    if (compact && a >= 1000) s = (a / 1000).toFixed(a >= 10000 ? 0 : 1) + "k";
    else if (compact && a >= 100) s = a.toFixed(0);
    else s = a.toLocaleString("en-GB", { minimumFractionDigits: 2, maximumFractionDigits: 2 });
    return `${sign}$${s}`;
  }
  const cls = v => v > 0.004 ? "up" : v < -0.004 ? "down" : "muted";
  const num = x => { const n = parseFloat(x); return isNaN(n) ? 0 : n; };
  const dayKey = t => new Date(t).toLocaleDateString("en-CA"); // YYYY-MM-DD, local time
  function startOfMonth(d) { return new Date(d.getFullYear(), d.getMonth(), 1); }
  const px = v => { const n = num(v); return n >= 100 ? n.toFixed(2) : n >= 1 ? n.toFixed(4) : n.toPrecision(4); };
  const esc = s => String(s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

  // ---------- API ----------
  async function info(body) {
    const r = await fetch(API, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) });
    if (!r.ok) throw new Error(`Hyperliquid returned ${r.status}`);
    return r.json();
  }

  // Pages forward through time until the API stops returning new rows.
  // Hyperliquid caps fills at 2000/response and keeps the 10,000 most recent.
  async function paged(type, idOf) {
    const out = new Map();
    let start = 0;
    for (let i = 0; i < 60; i++) {
      const batch = await info({ type, user: ADDRESS, startTime: start, endTime: Date.now() });
      if (!Array.isArray(batch) || !batch.length) break;
      let added = 0;
      for (const row of batch) { const id = idOf(row); if (!out.has(id)) { out.set(id, row); added++; } }
      if (!added) break;
      start = Math.max(...batch.map(r => r.time));
    }
    return [...out.values()].sort((a, b) => a.time - b.time);
  }

  async function loadHistory() {
    const [fills, funding, portfolio] = await Promise.all([
      paged("userFillsByTime", f => `${f.tid}-${f.hash}`),
      paged("userFunding", f => `${f.hash}-${f.time}-${f.delta?.coin}`),
      info({ type: "portfolio", user: ADDRESS }).catch(() => null),
    ]);
    state.fills = fills;
    state.funding = funding;
    state.portfolioAllTime = parsePortfolio(portfolio);
  }

  function parsePortfolio(p) {
    if (!Array.isArray(p)) return null;
    const entry = p.find(e => Array.isArray(e) && e[0] === "perpAllTime") || p.find(e => Array.isArray(e) && e[0] === "allTime");
    const hist = entry?.[1]?.pnlHistory;
    if (!Array.isArray(hist) || !hist.length) return null;
    return num(hist[hist.length - 1][1]);
  }

  async function loadLive() {
    const ch = await info({ type: "clearinghouseState", user: ADDRESS });
    state.accountValue = num(ch?.marginSummary?.accountValue);
    state.positions = (ch?.assetPositions || []).map(a => a.position).filter(p => num(p.szi) !== 0);
    state.unrealised = state.positions.reduce((s, p) => s + num(p.unrealizedPnl), 0);
  }

  // ---------- aggregation ----------
  // Daily net = realised PnL on closing fills − trading fees + funding received/paid.
  function aggregate() {
    const days = new Map();
    const get = k => days.get(k) || days.set(k, { realised: 0, fees: 0, funding: 0, net: 0, closes: 0, wins: 0, losses: 0 }).get(k);
    for (const f of state.fills) {
      const d = get(dayKey(f.time));
      const pnl = num(f.closedPnl), fee = num(f.fee);
      d.realised += pnl; d.fees += fee;
      if (pnl !== 0) { d.closes++; pnl > 0 ? d.wins++ : d.losses++; }
    }
    for (const f of state.funding) {
      const d = get(dayKey(f.time));
      d.funding += num(f.delta?.usdc);
    }
    for (const d of days.values()) d.net = d.realised - d.fees + d.funding;
    state.days = days;
  }

  function sumSince(daysBack) {
    const cutoff = new Date(); cutoff.setHours(0, 0, 0, 0); cutoff.setDate(cutoff.getDate() - (daysBack - 1));
    const ck = dayKey(cutoff);
    let s = 0; for (const [k, d] of state.days) if (k >= ck) s += d.net; return s;
  }

  // ---------- render ----------
  function render() {
    renderCalendar(); renderStats(); renderChart(); renderPositions(); renderBreakdown(); renderTrades();
  }

  function renderCalendar() {
    const m = state.viewMonth, y = m.getFullYear(), mo = m.getMonth();
    $("monthTitle").textContent = m.toLocaleDateString("en-GB", { month: "long", year: "numeric" });
    const daysIn = new Date(y, mo + 1, 0).getDate();
    const lead = (new Date(y, mo, 1).getDay() + 6) % 7; // Monday-first
    const todayK = dayKey(Date.now());

    let monthNet = 0, maxAbs = 0;
    for (let i = 1; i <= daysIn; i++) {
      const d = state.days.get(dayKey(new Date(y, mo, i)));
      if (d) { monthNet += d.net; maxAbs = Math.max(maxAbs, Math.abs(d.net)); }
    }
    const mn = $("monthNet"); mn.textContent = money(monthNet); mn.className = "month-net " + cls(monthNet);

    const cells = [];
    for (let i = 0; i < lead; i++) cells.push(`<div class="day blank" aria-hidden="true"></div>`);
    for (let i = 1; i <= daysIn; i++) {
      const k = dayKey(new Date(y, mo, i)), d = state.days.get(k);
      const future = k > todayK;
      let style = "", inner = `<span class="n">${i}</span>`;
      if (d && Math.abs(d.net) > 0.004) {
        const pct = Math.round(18 + 62 * Math.sqrt(Math.abs(d.net) / (maxAbs || 1)));
        style = `background: color-mix(in oklab, var(${d.net > 0 ? "--up" : "--down"}) ${pct}%, var(--surface)); color: ${pct > 50 ? "#fff" : "var(--ink)"};`;
        inner += `<span><span class="v">${money(d.net, true)}</span><br><span class="t" style="color:inherit;opacity:.8">${d.closes} closed</span></span>`;
      }
      const c = ["day", d ? "has" : "", k === todayK ? "today" : "", future ? "future" : "", state.selectedDay === k ? "sel" : ""].join(" ");
      cells.push(d
        ? `<button type="button" class="${c}" data-k="${k}" style="${style}" aria-label="${k}: ${money(d.net)}">${inner}</button>`
        : `<div class="${c}">${inner}</div>`);
    }
    $("grid").innerHTML = cells.join("");
    const now = startOfMonth(new Date());
    $("next").disabled = state.viewMonth >= now;
  }

  function setStat(id, v) { const el = $(id); el.textContent = money(v); el.className = "val " + cls(v); }
  function renderStats() {
    const today = state.days.get(dayKey(Date.now()));
    setStat("sToday", today ? today.net : 0);
    setStat("sWeek", sumSince(7));
    setStat("sMonth", sumSince(30));
    let all = 0; for (const d of state.days.values()) all += d.net;
    setStat("sAll", state.portfolioAllTime ?? all);
  }

  function renderChart() {
    const svg = $("chart"), keys = [...state.days.keys()].sort();
    if (keys.length < 2) { svg.innerHTML = `<text x="300" y="104" text-anchor="middle" fill="var(--muted)" font-size="13">Not enough history yet</text>`; return; }
    let run = 0; const pts = keys.map(k => (run += state.days.get(k).net, { k, v: run }));
    const W = 600, H = 200, P = 8;
    const lo = Math.min(0, ...pts.map(p => p.v)), hi = Math.max(0, ...pts.map(p => p.v));
    const sx = i => P + (i / (pts.length - 1)) * (W - 2 * P);
    const sy = v => H - P - ((v - lo) / ((hi - lo) || 1)) * (H - 2 * P);
    const line = pts.map((p, i) => `${sx(i).toFixed(1)},${sy(p.v).toFixed(1)}`).join(" ");
    const col = run >= 0 ? "var(--up)" : "var(--down)";
    svg.innerHTML = `
      <line x1="${P}" x2="${W - P}" y1="${sy(0)}" y2="${sy(0)}" stroke="var(--line)" stroke-dasharray="4 4" vector-effect="non-scaling-stroke"/>
      <polygon points="${sx(0)},${sy(0)} ${line} ${sx(pts.length - 1)},${sy(0)}" fill="${col}" opacity=".12"/>
      <polyline points="${line}" fill="none" stroke="${col}" stroke-width="2" vector-effect="non-scaling-stroke" stroke-linejoin="round"/>
      <line id="hoverLine" y1="0" y2="${H}" stroke="var(--muted)" vector-effect="non-scaling-stroke" opacity="0"/>`;
    const tip = $("chartTip");
    tip.textContent = `${keys[0]} to ${keys[keys.length - 1]}`;
    svg.onmousemove = e => {
      const r = svg.getBoundingClientRect();
      const i = Math.max(0, Math.min(pts.length - 1, Math.round(((e.clientX - r.left) / r.width * W - P) / (W - 2 * P) * (pts.length - 1))));
      const hl = svg.querySelector("#hoverLine"); hl.setAttribute("x1", sx(i)); hl.setAttribute("x2", sx(i)); hl.setAttribute("opacity", ".5");
      tip.innerHTML = `${pts[i].k}: <span class="${cls(pts[i].v)}">${money(pts[i].v)}</span> cumulative, <span class="${cls(state.days.get(pts[i].k).net)}">${money(state.days.get(pts[i].k).net)}</span> that day`;
    };
    svg.onmouseleave = () => { svg.querySelector("#hoverLine")?.setAttribute("opacity", "0"); tip.textContent = `${keys[0]} to ${keys[keys.length - 1]}`; };
  }

  function renderPositions() {
    const u = $("uPnl");
    u.innerHTML = state.positions.length ? `<span class="${cls(state.unrealised)}">${money(state.unrealised)}</span> unrealised` : "";
    $("positions").innerHTML = state.positions.length ? state.positions.map(p => {
      const sz = num(p.szi), up = num(p.unrealizedPnl);
      return `<tr><td>${esc(p.coin)}</td><td class="${sz > 0 ? "up" : "down"}">${sz > 0 ? "Long" : "Short"}</td>
        <td class="r">${Math.abs(sz)}</td><td class="r">${px(p.entryPx)}</td><td class="r">${p.leverage?.value ?? "–"}x</td>
        <td class="r">${p.liquidationPx ? px(p.liquidationPx) : "–"}</td><td class="r ${cls(up)}">${money(up)}</td></tr>`;
    }).join("") : `<tr><td colspan="7" class="empty-row">No open positions.</td></tr>`;
  }

  function renderBreakdown() {
    const sel = state.selectedDay;
    const days = sel ? [state.days.get(sel)].filter(Boolean) : [...state.days.values()];
    const t = days.reduce((a, d) => ({ r: a.r + d.realised, f: a.f + d.fees, fu: a.fu + d.funding, n: a.n + d.net, w: a.w + d.wins, l: a.l + d.losses }), { r: 0, f: 0, fu: 0, n: 0, w: 0, l: 0 });
    const traded = [...state.days.values()].filter(d => d.closes > 0);
    const green = traded.filter(d => d.net > 0).length;
    const sorted = [...state.days.entries()].sort((a, b) => a[1].net - b[1].net);
    const worst = sorted[0], best = sorted[sorted.length - 1];
    const winRate = t.w + t.l ? Math.round(100 * t.w / (t.w + t.l)) + "%" : "–";
    $("rangeLabel").textContent = sel ? new Date(sel + "T12:00").toLocaleDateString("en-GB", { weekday: "short", day: "numeric", month: "short" }) : "all synced history";
    const row = (k, v, c = "") => `<div class="k">${k}</div><div class="v ${c}">${v}</div>`;
    let html =
      row("Account value", state.accountValue != null ? "$" + state.accountValue.toLocaleString("en-GB", { maximumFractionDigits: 2 }) : "–") +
      row("Realised PnL", money(t.r), cls(t.r)) +
      row("Trading fees", money(-t.f), cls(-t.f)) +
      row("Funding", money(t.fu), cls(t.fu)) +
      row("Net", money(t.n), cls(t.n)) +
      row("Win rate (closes)", `${winRate} <span class="muted">(${t.w}W / ${t.l}L)</span>`);
    if (!sel && traded.length) {
      html += row("Green days", `${green} of ${traded.length}`);
      if (best) html += row("Best day", `${money(best[1].net)} <span class="muted">${best[0].slice(5)}</span>`, "up");
      if (worst && worst[1].net < 0) html += row("Worst day", `${money(worst[1].net)} <span class="muted">${worst[0].slice(5)}</span>`, "down");
    }
    $("breakdown").innerHTML = html;
  }

  function renderTrades() {
    const sel = state.selectedDay;
    let rows = state.fills.filter(f => num(f.closedPnl) !== 0 || (sel && dayKey(f.time) === sel));
    if (sel) rows = rows.filter(f => dayKey(f.time) === sel);
    rows = rows.slice(-50).reverse();
    $("tradesLabel").textContent = sel ? `fills on ${sel}` : "most recent 50 closes";
    $("clearDay").hidden = !sel;
    $("trades").innerHTML = rows.length ? rows.map(f => {
      const pnl = num(f.closedPnl);
      const t = new Date(f.time).toLocaleString("en-GB", { day: "2-digit", month: "short", hour: "2-digit", minute: "2-digit" });
      return `<tr><td>${t}</td><td>${esc(f.coin)}</td><td>${esc(f.dir || (f.side === "B" ? "Buy" : "Sell"))}</td>
        <td class="r">${esc(f.sz)}</td><td class="r">${px(f.px)}</td><td class="r muted">${money(-num(f.fee))}</td>
        <td class="r ${cls(pnl)}">${pnl ? money(pnl) : "–"}</td></tr>`;
    }).join("") : `<tr><td colspan="7" class="empty-row">No closed trades in this range.</td></tr>`;
  }

  // ---------- sync ----------
  function setSync(status, text) {
    $("dot").className = "dot " + (status === "busy" ? "busy" : status === "err" ? "err" : "");
    $("syncText").textContent = text;
  }
  function showBanner(html, info = false) { const b = $("banner"); b.innerHTML = html; b.className = "banner" + (info ? " info" : ""); b.hidden = false; }
  function hideBanner() { $("banner").hidden = true; }

  let syncing = false;
  async function sync(full) {
    if (syncing || DEMO) return;
    syncing = true; setSync("busy", full ? "Syncing history…" : "Updating…");
    try {
      await Promise.all([loadLive(), full ? loadHistory() : null]);
      aggregate(); render(); hideBanner();
      state.lastSync = Date.now(); tick();
    } catch (e) {
      setSync("err", "Sync failed");
      showBanner(`Couldn't load data from Hyperliquid: ${esc(e.message)}. It retries automatically.
        If this persists and you opened the file straight from your downloads, try hosting it (GitHub Pages or Netlify, both free).`);
    } finally { syncing = false; }
  }
  function tick() {
    if (!state.lastSync) return;
    const s = Math.round((Date.now() - state.lastSync) / 1000);
    $("syncText").textContent = s < 60 ? `Updated ${s}s ago` : `Updated ${Math.round(s / 60)}m ago`;
    if ($("dot").className.includes("busy")) return;
    $("dot").className = "dot";
  }

  // ---------- demo data (?demo=1) ----------
  function loadDemo() {
    const coins = ["PYTH", "PUMP", "UNI", "ZEC", "BTC", "ETH", "SOL"];
    const now = Date.now(), DAY = 864e5;
    let seed = 7; const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
    const fills = [], funding = [];
    for (let d = 75; d >= 0; d--) {
      if (rnd() < 0.2) continue;
      const n = 1 + Math.floor(rnd() * 5);
      for (let i = 0; i < n; i++) {
        const t = now - d * DAY - rnd() * DAY * 0.9, coin = coins[Math.floor(rnd() * coins.length)];
        const pnl = (rnd() - 0.45) * 90, long = rnd() > 0.4;
        fills.push({ time: t - 3600e3, coin, side: long ? "B" : "A", dir: long ? "Open Long" : "Open Short", sz: (rnd() * 50).toFixed(1), px: (rnd() * 40 + 1).toFixed(4), fee: (rnd() * 0.6).toFixed(4), closedPnl: "0", tid: fills.length, hash: "o" + fills.length });
        fills.push({ time: t, coin, side: long ? "A" : "B", dir: long ? "Close Long" : "Close Short", sz: (rnd() * 50).toFixed(1), px: (rnd() * 40 + 1).toFixed(4), fee: (rnd() * 0.6).toFixed(4), closedPnl: pnl.toFixed(2), tid: fills.length, hash: "c" + fills.length });
      }
      for (let h = 0; h < 24; h += 8) funding.push({ time: now - d * DAY + h * 3600e3, delta: { coin: "PYTH", usdc: ((rnd() - 0.6) * 0.8).toFixed(4) }, hash: "f" + d + h });
    }
    state.fills = fills.filter(f => f.time <= now).sort((a, b) => a.time - b.time);
    state.funding = funding.filter(f => f.time <= now);
    state.positions = [
      { coin: "PYTH", szi: "1520", entryPx: "0.1412", leverage: { value: 5 }, liquidationPx: "0.1188", unrealizedPnl: "12.84" },
      { coin: "ZEC", szi: "-0.8", entryPx: "48.21", leverage: { value: 3 }, liquidationPx: "61.40", unrealizedPnl: "-3.10" },
    ];
    state.unrealised = 9.74; state.accountValue = 742.18;
    aggregate(); render();
    setSync("ok", "Demo data");
    showBanner(`Showing fake demo data. Set <code>WALLET</code> at the top of the file, or open with <code>?address=0x…</code>, to load real trades.`, true);
  }

  // ---------- events ----------
  $("prev").onclick = () => { state.viewMonth = new Date(state.viewMonth.getFullYear(), state.viewMonth.getMonth() - 1, 1); renderCalendar(); };
  $("next").onclick = () => { state.viewMonth = new Date(state.viewMonth.getFullYear(), state.viewMonth.getMonth() + 1, 1); renderCalendar(); };
  $("grid").onclick = e => {
    const b = e.target.closest("button.day"); if (!b) return;
    state.selectedDay = state.selectedDay === b.dataset.k ? null : b.dataset.k;
    renderCalendar(); renderBreakdown(); renderTrades();
  };
  $("clearDay").onclick = () => { state.selectedDay = null; renderCalendar(); renderBreakdown(); renderTrades(); };
  $("refresh").onclick = () => DEMO ? loadDemo() : sync(true);

  // ---------- boot ----------
  if (DEMO) { $("wallet").textContent = "demo"; loadDemo(); return; }
  if (!/^0x[0-9a-fA-F]{40}$/.test(ADDRESS)) {
    render();
    setSync("err", "No wallet set");
    showBanner(ADDRESS
      ? `<b>${esc(ADDRESS)}</b> isn't a valid wallet address. It should start with 0x followed by 40 characters.`
      : `No wallet address set yet. Paste the Hyperliquid address from Invo into <code>WALLET</code> at the top of this file. To preview the layout, add <code>?demo=1</code> to the URL.`, true);
    return;
  }
  $("wallet").textContent = ADDRESS.slice(0, 6) + "…" + ADDRESS.slice(-4);
  sync(true);
  setInterval(() => sync(false), LIVE_REFRESH_MS);
  setInterval(() => sync(true), FULL_REFRESH_MS);
  setInterval(tick, 5000);
  document.addEventListener("visibilitychange", () => { if (!document.hidden) sync(false); });
})();
</script>
</body>
</html>
